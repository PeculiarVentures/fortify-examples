<!DOCTYPE html>
<!-- Data signing/verify -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Example #5</title>
  <!-- Babel Polyfill -->
  <script src="https://fortifyapp.com/external/babel-polyfill/6.26.0/polyfill.min.js"></script>

  <!-- Fetch Polyfill -->
  <script
    nomodule
    src="https://fortifyapp.com/external/whatwg-fetch@3.0.0/fetch.umd.js"
  ></script>

  <!-- Crypto Polyfill -->
  <script src="https://fortifyapp.com/external/asmCrypto/2.3.2/asmcrypto.all.es5.min.js"></script>
  <script src="https://fortifyapp.com/external/elliptic/elliptic.min.js"></script>
  <script
    type="module"
    src="https://fortifyapp.com/external/webcrypto-liner/1.2.3/webcrypto-liner.shim.min.mjs"
  ></script>
  <script
    nomodule
    src="https://fortifyapp.com/external/webcrypto-liner/1.2.3/webcrypto-liner.shim.min.js"
  ></script>

  <!-- WebCrypto Socket -->
  <script src="https://fortifyapp.com/external/protobuf/6.8.0/protobuf.min.js"></script>
  <script src="https://fortifyapp.com/external/webcrypto-local/client/1.7.1/webcrypto-socket.min.js"></script>

  <!-- CMS -->
  <script src="https://fortifyapp.com/external/pvtsutils/pvtsutils.js"></script>
  <script src="https://fortifyapp.com/external/asn1js/asn1.min.js"></script>
  <script src="https://fortifyapp.com/external/pkijs/pki.min.js"></script>
  <script src="src/helper.js"></script>
  <style>
    label {
      display: inline-block;
      width: 128px;
    }

    select {
      display: inline-block;
      width: 256px;
    }

    input[type=text] {
      display: inline-block;
      width: 256px;
    }

    .group {
      padding: 8px 16px;
    }
  </style>
</head>

<body>
  <h2>Signing with a key via Fortify</h2>
  <div class="group">
    <label for="providers">Providers:</label>
    <select id="providers"></select>
  </div>
  <div class="group">
    <label for="certificates">Certificates:</label>
    <select id="certificates"></select>
  </div>
  <div class="group" id="sig-mode-container" style="display:none">
    <label for="sig-mode">Signature Mode:</label>
    <select id="sig-mode">
      <option value="PKCS1">PKCS1 (default)</option>
      <option value="PSS">PSS</option>
    </select>
  </div>
  <div class="group">
    <label for="message">Message:</label>
    <input id="message" type="text" value="Test message"></input>
  </div>
  <div class="group">
    <label for="signature">Signature(HEX):</label>
    <input id="signature" type="text"></input>
  </div>
  <div class="group">
    <label>Verification:</label>
    <span id="verification"></span>
  </div>
  <div class="group">
    <label>WebCrypto:</label>
    <span id="verification2"></span>
  </div>
  <div class="group">
    <button id="sign">Sign</button>
  </div>
  <div>
    <code>
      <pre id="log"></pre>
    </code>
  </div>
  <script>
    let providers = [];

    async function main() {
      self.ws = new WebcryptoSocket.SocketProvider({
        storage: await WebcryptoSocket.BrowserStorage.create(),
      });
      ws.connect("127.0.0.1:31337")
        .on("error", function (e) {
          console.error(e);
        })
        .on("listening", async (e) => {
          // Check if end-to-end session is approved
          if (! await ws.isLoggedIn()) {
            const pin = await ws.challenge();
            // show PIN
            setTimeout(() => {
              alert("2key session PIN:" + pin);
            }, 100)
            // ask to approve session
            await ws.login();
          }

          await FillData();

          ws.cardReader
            .on("insert", updateProvider)
            .on("remove", updateProvider);
        });
    }

    async function updateProvider() {
      const $providers = document.getElementById("providers");

      $providers.innerHTML = "";
      await FillData();
    }

    async function FillData() {
      await FillProviderSelect($("providers"));
      const providerID = $("providers").value;
      if (providerID) {
        const crypto = await ws.getCrypto(providerID);
        fillCertificateSelect(crypto, $("certificates"))
      }

      const info = await self.ws.info();
      providers = [...info.providers];
    }

    $("providers").onchange = async () => {
      const providerID = $("providers").value;
      const provider = await ws.getCrypto(providerID)
      fillCertificateSelect(provider, $("certificates"))
    }

    const $sign = $("sign");
    const $certificates = $("certificates");
    const $message = $("message");
    const $signature = $("signature");
    const $verification = $("verification");
    const $verification2 = $("verification2");
    const $log = $("log");

    const logWrite = (text) => {
      $log.textContent += text + "\n";
    }

    const logClear = () => {
      $log.textContent = "";
    }

    $certificates.addEventListener("change", async () => {
      try {
        const provider = await ws.getCrypto($("providers").value);
        const key = await GetCertificateKey("private", provider, $certificates.value);
        
        if(key && key.algorithm.name.startsWith("RSA")){
          const selectedProvider = providers.find(p => p.id === $("providers").value);
          // Filter supported RSA algorithms in the order they appear
          const allowed = [];
          if(selectedProvider.algorithms.includes("RSASSA-PKCS1-v1_5")){
            allowed.push("RSASSA-PKCS1-v1_5");
          }
          if(selectedProvider.algorithms.includes("RSA-PSS")){
            allowed.push("RSA-PSS");
          }
          // Clear and repopulate the selector options
          $("sig-mode").innerHTML = "";
          allowed.forEach((alg) => {
            const opt = document.createElement("option");
            if(alg === "RSASSA-PKCS1-v1_5"){
              opt.value = "RSASSA-PKCS1-v1_5";
              opt.textContent = "PKCS1";
            } else {
              opt.value = "RSA-PSS";
              opt.textContent = "PSS";
            }
            $("sig-mode").appendChild(opt);
          });
          $("sig-mode-container").style.display = "block";
        } else {
          $("sig-mode-container").style.display = "none";
        }
        
        const certificate = await provider.certStorage.getItem($certificates.value);

        logClear();

        const logMessage = [];
        logMessage.push('Certificate:');
        logMessage.push(`  Subject: ${certificate.subjectName}`);
        logMessage.push(`  Issuer: ${certificate.issuerName}`);
        logMessage.push(`  Not before: ${certificate.notBefore}`);
        logMessage.push(`  Not after: ${certificate.notAfter}`);

        let algName = key.algorithm.name;
        if (algName.startsWith("RSA")) {
          algName += ` (${key.algorithm.modulusLength} bits)`;
        } else if (algName.startsWith("EC")) {
          algName += ` (${key.algorithm.namedCurve})`;
        }

        logMessage.push('');

        logMessage.push('Private key:');
        logMessage.push(`  Algorithm: ${algName}`);
        logMessage.push(`  Extractable: ${key.extractable}`);
        logMessage.push(`  label: ${key.algorithm.label}`);
        logMessage.push(`  Sensitive: ${key.algorithm.sensitive}`);

        logWrite(logMessage.join('\n'));

      } catch (e) {
        alert('Error while getting certificate and key. See console for more details');
        logWrite(`Error: ${e.message}`);
        console.error(e);
      }
    });

    $sign.onclick = async () => {
      $sign.disabled = true;

      try {
        // Clear fields
        $signature.value = "";
        $verification.textContent = "";

        const provider = await ws.getCrypto($("providers").value);
        let key = await GetCertificateKey("private", provider, $("certificates").value);
        if (!key) {
          throw new Error("Certificate doesn't have private key");
        }

        // Determine signing algorithm; choose based on selector for RSA
        let alg = {};
        if(key.algorithm.name.startsWith("RSA")){
          const mode = $("sig-mode").value;
          if(mode === "RSA-PSS"){
            alg = { name: "RSA-PSS", hash: "SHA-256", saltLength: 32 };
          } else {
            alg = { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" };
          }
          // Get the same key but with the specified algorithm
          const keyIndex = await provider.keyStorage.indexOf(key);
          key = await provider.keyStorage.getItem(keyIndex, alg, false, ["sign"]);
        } else {
          alg = { name: key.algorithm.name, hash: "SHA-256" };
        }

        logWrite("");
        logWrite(`Signing with ${alg.name} algorithm`);

        const message = pvtsutils.Convert.FromUtf8String($("message").value);
        const signature = await provider.subtle.sign(alg, key, message);
        $signature.value = pvtsutils.Convert.ToHex(signature);
        const publicKey = await GetCertificateKey("public", provider, $("certificates").value, alg, true, ["verify"]);

        const spki = await provider.subtle.exportKey("spki", publicKey);
        const publicKey2 = await crypto.subtle.importKey("spki", spki, publicKey.algorithm, true, ["verify"]);

        const ok = await provider.subtle.verify(alg, publicKey, signature, message);
        $verification.textContent = ok.toString();

        const ok2 = await crypto.subtle.verify(alg, publicKey2, signature, message);
        $verification2.textContent = ok2.toString();
      }
      finally {
        $sign.disabled = false;
      }

    }

    main();
  </script>
</body>

</html>
